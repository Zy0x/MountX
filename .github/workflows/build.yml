name: Build & Release MountX

on:
  push:
    branches: [ main ]
    tags:
      - 'v*'
  pull_request:
    branches: [ main ]
  workflow_dispatch:
    inputs:
      create_release:
        description: 'Create GitHub Release? (only works if tag_name is provided)'
        required: false
        default: 'false'
        type: boolean
      tag_name:
        description: 'Tag name for release (e.g. v2.2.45)'
        required: false
        default: ''

jobs:
  build:
    name: Build Release APK & Magisk Module
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Decode Release Keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            mkdir -p app/build
            echo "$KEYSTORE_BASE64" | base64 -d > app/build/release.jks
            echo "✅ Keystore decoded — will use production signing"
          else
            echo "⚠️ No keystore secret found — will use debug signing as fallback"
          fi

      - name: Build Release APK
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        run: ./gradlew assembleRelease --stacktrace

      - name: Extract Version Name
        id: version
        run: |
          VERSION=$(grep -m 1 'versionName = ' app/build.gradle.kts | cut -d'"' -f2)
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "📦 Version: $VERSION"

      - name: Rename APK
        run: |
          mkdir -p release-output
          cp app/build/outputs/apk/release/app-release.apk \
             release-output/MountX-v${{ steps.version.outputs.version }}.apk
          echo "✅ APK: MountX-v${{ steps.version.outputs.version }}.apk"

      - name: Package Magisk Module Zip
        run: |
          cd module
          zip -r ../release-output/MountX-Magisk-v${{ steps.version.outputs.version }}.zip ./*
          cd ..
          echo "✅ Module: MountX-Magisk-v${{ steps.version.outputs.version }}.zip"

      - name: Upload Release APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: MountX-v${{ steps.version.outputs.version }}-release
          path: release-output/MountX-v${{ steps.version.outputs.version }}.apk
          if-no-files-found: error

      - name: Upload Magisk Module Artifact
        uses: actions/upload-artifact@v4
        with:
          name: MountX-Magisk-v${{ steps.version.outputs.version }}
          path: release-output/MountX-Magisk-v${{ steps.version.outputs.version }}.zip
          if-no-files-found: ignore

  release:
    name: Create GitHub Release
    needs: build
    if: startsWith(github.ref, 'refs/tags/') || (github.event_name == 'workflow_dispatch' && inputs.create_release == 'true' && inputs.tag_name != '')
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Extract Version Name
        id: version
        run: |
          VERSION=$(grep -m 1 'versionName = ' app/build.gradle.kts | cut -d'"' -f2)
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - name: Extract Changelog Since Last Release
        id: changelog
        run: |
          CURRENT_VERSION="${{ steps.version.outputs.version }}"

          # Find previous public release tag (exclude current if exists)
          PREV_TAG=$(gh release list --repo ${{ github.repository }} --limit 10 --json tagName \
            --jq "[.[].tagName | select(. != \"v$CURRENT_VERSION\")] | first" 2>/dev/null || echo "")

          echo "Current version : v$CURRENT_VERSION"
          echo "Previous release: ${PREV_TAG:-none}"

          if [ -z "$PREV_TAG" ]; then
            PREV_VERSION=""
          else
            PREV_VERSION="${PREV_TAG#v}"
          fi

          # Extract all sections from current down to (not including) previous release
          if [ -z "$PREV_VERSION" ]; then
            NOTES=$(awk '/^## \[/{found=1} found{print}' CHANGELOG.md)
          else
            NOTES=$(awk "/^## \[/{found=1} found && /^## \[$PREV_VERSION\]/{exit} found{print}" CHANGELOG.md)
          fi

          [ -z "$NOTES" ] && NOTES="See [CHANGELOG.md](CHANGELOG.md) for full release notes."

          TOTAL_SECTIONS=$(echo "$NOTES" | grep -c "^## \[" || echo "1")
          {
            echo "## Release Notes — MountX v$CURRENT_VERSION"
            echo ""
            if [ "$TOTAL_SECTIONS" -gt 1 ]; then
              echo "> This release includes **$TOTAL_SECTIONS** updates since \`${PREV_TAG:-initial release}\`."
              echo ""
            fi
            echo "$NOTES"
          } > /tmp/release_notes.md

          echo "✅ Release notes: $TOTAL_SECTIONS section(s) aggregated"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Download Release APK Artifact
        uses: actions/download-artifact@v4
        with:
          name: MountX-v${{ steps.version.outputs.version }}-release
          path: release-apk/

      - name: Download Magisk Module Artifact
        uses: actions/download-artifact@v4
        with:
          name: MountX-Magisk-v${{ steps.version.outputs.version }}
          path: release-module/

      - name: Determine Tag Name
        id: tag
        run: |
          if [ "${{ github.event_name }}" == "workflow_dispatch" ]; then
            echo "tag=${{ inputs.tag_name }}" >> $GITHUB_OUTPUT
          else
            echo "tag=${{ github.ref_name }}" >> $GITHUB_OUTPUT
          fi

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.tag }}
          name: "MountX v${{ steps.version.outputs.version }}"
          body_path: /tmp/release_notes.md
          files: |
            release-apk/*.apk
            release-module/*.zip
          draft: false
          prerelease: false
          make_latest: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
