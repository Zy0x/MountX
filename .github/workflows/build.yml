name: Build & Release Mountify

on:
  push:
    branches: [ main ]
    tags:
      - 'v*'
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    name: Build APK & Magisk Module
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Decode Release Keystore
        if: ${{ env.KEYSTORE_BASE64 != '' }}
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          mkdir -p app/build
          echo "$KEYSTORE_BASE64" | base64 -d > app/build/release.jks

      - name: Build Debug APK
        if: startsWith(github.ref, 'refs/tags/') != true
        run: ./gradlew assembleDebug --stacktrace

      - name: Build Release APK
        if: startsWith(github.ref, 'refs/tags/') || github.ref == 'refs/heads/main'
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: ./gradlew assembleRelease --stacktrace

      - name: Package Magisk Module Zip
        run: |
          cd module
          zip -r ../mountify-magisk-module.zip ./*
          cd ..

      - name: Upload Debug APK Artifact
        if: startsWith(github.ref, 'refs/tags/') != true
        uses: actions/upload-artifact@v4
        with:
          name: Mountify-Debug-APK
          path: app/build/outputs/apk/debug/*.apk

      - name: Upload Release APK Artifact
        if: startsWith(github.ref, 'refs/tags/') || github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v4
        with:
          name: Mountify-Release-APK
          path: app/build/outputs/apk/release/*.apk

      - name: Upload Magisk Module Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Mountify-Magisk-Module
          path: mountify-magisk-module.zip

  release:
    name: Create GitHub Release
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download Release APK Artifact
        uses: actions/download-artifact@v4
        with:
          name: Mountify-Release-APK
          path: release-apk/

      - name: Download Magisk Module Artifact
        uses: actions/download-artifact@v4
        with:
          name: Mountify-Magisk-Module
          path: release-module/

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            release-apk/*.apk
            release-module/*.zip
          generate_release_notes: true
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
