# Mountify Configuration
# SD card block device and mount settings

# Mount point for the external SD partition (ext4/f2fs)
SD_BASE=/data/sdext2

# Block device for the external SD partition
# Adjust to match your device (e.g. mmcblk1p1, sda1)
SD_BLOCK=/dev/block/mmcblk0p3

# Filesystem type: f2fs | ext4
FS_TYPE=f2fs