# MountX Gradle Properties - Safe throttled build configuration to prevent CPU/VRM spike and BSOD
org.gradle.jvmargs=-Xmx2560m -XX:MaxMetaspaceSize=512m -XX:+UseG1GC -Dfile.encoding=UTF-8
org.gradle.workers.max=2
org.gradle.parallel=false
kotlin.daemon.jvmargs=-Xmx1024m
android.useAndroidX=true

android.nonTransitiveRClass=true
kotlin.code.style=official

