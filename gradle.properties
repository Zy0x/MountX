# MountX Gradle Properties - Ultra-safe throttled build configuration to prevent CPU/VRM spike and BSOD
org.gradle.jvmargs=-Xmx1800m -XX:MaxMetaspaceSize=384m -XX:+UseG1GC -Dfile.encoding=UTF-8
org.gradle.workers.max=1
org.gradle.parallel=false
kotlin.daemon.jvmargs=-Xmx768m
android.useAndroidX=true

android.nonTransitiveRClass=true
kotlin.code.style=official

